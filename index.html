        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isDraggingToPlace) {
                cancelDragging();
                e.preventDefault();
            }
        });

        // --- 导入模型 ---
        modelInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) { modelInput.value = ''; return; }

            const file = files[0];
            const ext = file.name.split('.').pop().toLowerCase();

            let pos, normal;
            if (pendingPos) {
                pos = pendingPos.point.clone();
                normal = pendingPos.normal.clone();
                pendingPos = null;
            } else {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                pos = camera.position.clone().add(dir.multiplyScalar(3));
                normal = new THREE.Vector3(0, 1, 0);
            }

            try {
                let model;
                const url = URL.createObjectURL(file);

                if (ext === 'glb' || ext === 'gltf') {
                    const gltfLoader = new GLTFLoader();
                    model = await new Promise((resolve, reject) => {
                        gltfLoader.load(url, (gltf) => resolve(gltf.scene), undefined, reject);
                    });
                } else if (ext === 'dae') {
                    const daeLoader = new ColladaLoader();
                    model = await new Promise((resolve, reject) => {
                        daeLoader.load(url, (collada) => resolve(collada.scene), undefined, reject);
                    });
                } else if (ext === 'obj') {
                    const objLoader = new OBJLoader();
                    model = await new Promise((resolve, reject) => {
                        objLoader.load(url, (obj) => resolve(obj), undefined, reject);
                    });
                } else {
                    showToast('❌ 不支持的格式: ' + ext, 2000);
                    modelInput.value = '';
                    return;
                }

                model.position.copy(pos);
                if (normal && normal.length() > 0.001 && Math.abs(normal.y) < 0.9) {
                    const up = new THREE.Vector3(0, 1, 0);
                    const quat = new THREE.Quaternion().setFromUnitVectors(up, normal);
                    model.quaternion.copy(quat);
                }

                model.traverse((child) => {
                    if (child.isMesh) {
                        const borderMat = new THREE.LineBasicMaterial({
                            color: 0x88ddff, transparent: true,
                            opacity: 0
                        });
                        const border = new THREE.LineSegments(new THREE.EdgesGeometry(child.geometry),
                            borderMat);
                        child.add(border);
                        child.userData.borderMat = borderMat;
                    }
                });

                model.userData = {
                    isObject: true,
                    id: ++objectIdCounter,
                    name: file.name,
                    color: color,
                    normal: normal ? normal.clone() : null,
                    originalColor: color,
                    isImported: true
                };

                scene.add(model);
                customObjects.push(model);
                pushHistory(`导入 ${file.name}`, { obj: model });
                showToast(`✅ 已导入: ${file.name}`, 2000);

            } catch (err) {
                console.error('导入失败:', err);
                showToast('❌ 导入失败: ' + err.message, 2000);
            }

            modelInput.value = '';
        });

        // ============================================================
        //  滚轮控制
        // ============================================================
        renderer.domElement.addEventListener('wheel', (e) => {
            if (isLightEditing && selectedLight) {
                e.preventDefault();
                if (e.ctrlKey) {
                    const d = e.deltaY > 0 ? -0.2 : 0.2;
                    const newIntensity = Math.max(0.1, selectedLight.userData.intensity + d);
                    updateLightIntensity(selectedLight, newIntensity);
                    showToast(`💡 亮度: ${newIntensity.toFixed(1)}`, 500);
                } else {
                    const d = e.deltaY > 0 ? -0.1 : 0.1;
                    const newSize = Math.max(0.1, selectedLight.userData.size + d);
                    updateLightSize(selectedLight, newSize);
                    showToast(`📏 大小: ${newSize.toFixed(1)}`, 500);
                }
                return;
            }

            if (isEditing && selectedObject) {
                e.preventDefault();
                const d = e.deltaY > 0 ? 0.05 : -0.05;
                selectedObject.rotation.y += d;
                showToast(`🔄 ${(selectedObject.rotation.y * 180 / Math.PI % 360).toFixed(0)}°`, 500);
                return;
            }
        }, { passive: false });

        // ============================================================
        //  拖拽移动
        // ============================================================
        let isDragging = false;
        let isResizingLight = false;
        let dragStart = new THREE.Vector2();
        let dragOrigin = new THREE.Vector3();
        let dragPlane = new THREE.Plane();
        let dragIntersect = new THREE.Vector3();
        let dragTarget = null;
        let dragTargetType = '';
        let dragOriginSize = 0;
        let dragOriginIntensity = 0;

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (ctx.style.display === 'block') return;
            if (isScaling) return;
            if (isImageResizing) return;
            if (isDraggingToPlace) return;

            const hit = getHit(e, true);
            if (!hit) return;

            const obj = findObject(hit.object);
            const light = findLight(hit.object);
            const img = findImage(hit.object);

            if (obj && isEditing && obj === selectedObject) {
                dragTarget = obj;
                dragTargetType = 'object';
                isResizingLight = false;
            } else if (light && isLightEditing && light === selectedLight) {
                dragTarget = light;
                dragTargetType = 'light';
                isResizingLight = e.ctrlKey;
                if (isResizingLight) {
                    dragOriginSize = light.userData.size;
                    dragOriginIntensity = light.userData.intensity;
                }
            } else if (img && isImageEditing && img === selectedImage) {
                dragTarget = img;
                dragTargetType = 'image';
                isResizingLight = false;
            } else {
                return;
            }

            isDragging = true;
            dragStart.set(e.clientX, e.clientY);
            dragOrigin.copy(dragTarget.position);
            if (!isResizingLight) {
                if (dragTargetType === 'light') {
                    const normal = dragTarget.userData.normal || new THREE.Vector3(0, 1, 0);
                    dragPlane.setFromNormalAndCoplanarPoint(normal, dragTarget.position);
                } else {
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    dragPlane.setFromNormalAndCoplanarPoint(dir, dragTarget.position);
                }
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(dragPlane, dragIntersect);
                renderer.domElement.style.cursor = 'grabbing';
            } else {
                renderer.domElement.style.cursor = 'ns-resize';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !dragTarget) return;
            if (dragTargetType === 'light' && isResizingLight) {
                const dy = dragStart.y - e.clientY;
                const delta = dy * 0.01;
                const newSize = Math.max(0.1, dragOriginSize + delta);
                const newIntensity = Math.max(0.1, dragOriginIntensity + delta * 0.8);
                updateLightSize(dragTarget, newSize);
                updateLightIntensity(dragTarget, newIntensity);
                showToast(`📏 大小 ${newSize.toFixed(2)} / 亮度 ${newIntensity.toFixed(1)}`, 200);
                return;
            }
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const p = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, p);
            if (p) {
                const off = p.clone().sub(dragIntersect);
                const n = dragTarget.userData.normal || new THREE.Vector3(0, 1, 0);
                off.add(n.clone().multiplyScalar(-off.dot(n)));
                dragTarget.position.copy(dragOrigin).add(off);
                if (dragTargetType === 'object') {
                    showScaleHandles(dragTarget);
                }
                if (dragTargetType === 'image') {
                    showImageResizeHandles(dragTarget);
                }
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                isResizingLight = false;
                dragTarget = null;
                dragTargetType = '';
                renderer.domElement.style.cursor = 'default';
            }
        });

        // ============================================================
        //  动线点系统 - 修复视角问题
        // ============================================================
        function createWaypointMarker(pos, label = '') {
            const group = new THREE.Group();
            const ringGeo = new THREE.RingGeometry(0.25, 0.35, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x88ddff, side: THREE.DoubleSide, transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.01;
            group.add(ring);
            const dotGeo = new THREE.CircleGeometry(0.08, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0x88ddff });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.rotation.x = -Math.PI / 2;
            dot.position.y = 0.015;
            group.add(dot);
            const pillarGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.3, 6);
            const pillarMat = new THREE.MeshBasicMaterial({ color: 0x88ddff, transparent: true, opacity: 0.25 });
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.y = 0.15;
            group.add(pillar);
            group.position.copy(pos);
            group.userData = { isWaypoint: true, id: ++waypointId, label: label };
            scene.add(group);
            waypointMarkers.push(group);
            return group;
        }

        function addWaypointAtCurrentPosition() {
            if (!modelLoaded) { showToast('⏳ 请等待模型加载完成'); return; }
            const pos = camera.position.clone();
            pos.y = 0;
            createWaypointMarker(pos, `点${waypointId}`);
            waypoints.push(pos);
            showToast(`📍 动线点 #${waypointId} 已添加`, 2000);
            return pos;
        }

        function clearWaypoints() {
            if (waypointMarkers.length === 0) { showToast('没有动线点'); return; }
            if (!confirm('确定清空所有动线点吗？')) return;
            waypointMarkers.forEach(m => {
                scene.remove(m);
                m.children.forEach(c => {
                    if (c.geometry) c.geometry.dispose(); if (c.material) c.material
                        .dispose();
                });
            });
            waypointMarkers.length = 0;
            waypoints.length = 0;
            waypointId = 0;
            showToast('🗑️ 已清空所有动线点');
        }

        let isMoving = false;
        let moveStart = new THREE.Vector3();
        let moveEnd = new THREE.Vector3();
        let moveTargetStart = new THREE.Vector3();
        let moveTargetEnd = new THREE.Vector3();
        let moveProgress = 0;
        const MOVE_DURATION = 0.8;

        function moveToWaypoint(targetPos) {
            if (isMoving) return;
            if (!modelLoaded) { showToast('⏳ 请等待模型加载完成'); return; }
            const endPos = targetPos.clone();
            endPos.y = camera.position.y;

            const offset = new THREE.Vector3().copy(controls.target).sub(camera.position);
            const endTarget = endPos.clone().add(offset);

            moveStart.copy(camera.position);
            moveEnd.copy(endPos);
            moveTargetStart.copy(controls.target);
            moveTargetEnd.copy(endTarget);
            moveProgress = 0;
            isMoving = true;
            controls.enableRotate = false;
            showToast(`🚶 移动到 ${targetPos.x.toFixed(2)}, ${targetPos.z.toFixed(2)}`, 1000);
        }

        function updateMovement(dt) {
            if (!isMoving) return;
            moveProgress += dt / MOVE_DURATION;
            if (moveProgress >= 1) {
                moveProgress = 1;
                isMoving = false;
                controls.enableRotate = true;
            }
            const t = 1 - Math.pow(1 - moveProgress, 3);
            camera.position.lerpVectors(moveStart, moveEnd, t);
            controls.target.lerpVectors(moveTargetStart, moveTargetEnd, t);
        }

        // ============================================================
        //  视角高度控制 (E/Q)
        // ============================================================
        function adjustCameraHeight(delta) {
            const newHeight = Math.max(0.3, Math.min(8, camera.position.y + delta));
            const diff = newHeight - camera.position.y;
            camera.position.y = newHeight;
            controls.target.y += diff;
            controls.update();
            cameraHeight = newHeight;
            showToast(`👁️ 视角高度: ${newHeight.toFixed(2)}`, 500);
        }

        // ============================================================
        //  撤销系统
        // ============================================================
        const UNDO_LIMIT = 30;
        const history = [];
        let historyIndex = -1;

        function pushHistory(action, data) {
            if (suppressHistory) return;
            while (history.length > historyIndex + 1) {
                history.pop();
            }
            history.push({ action, data, timestamp: Date.now() });
            if (history.length > UNDO_LIMIT) {
                history.shift();
            }
            historyIndex = history.length - 1;
            updateUndoButton();
        }

        function undo() {
            if (historyIndex <= 0) {
                showToast('⚠️ 没有可以撤销的操作', 1000);
                return;
            }
            const current = history[historyIndex];
            if (current.data && current.data.obj) {
                const obj = current.data.obj;
                if (obj.parent) {
                    scene.remove(obj);
                    if (obj.userData.isObject) {
                        const idx = customObjects.indexOf(obj);
                        if (idx > -1) customObjects.splice(idx, 1);
                        if (selectedObject === obj) deselectObject();
                    }
                    if (obj.userData.isImage) {
                        const idx = images.indexOf(obj);
                        if (idx > -1) images.splice(idx, 1);
                        if (selectedImage === obj) deselectImage();
                    }
                    if (obj.userData.isLight) {
                        const idx = lightObjects.indexOf(obj);
                        if (idx > -1) lightObjects.splice(idx, 1);
                        if (selectedLight === obj) deselectLight();
                        obj.children.forEach(child => {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) child.material.dispose();
                            if (child.dispose) child.dispose();
                        });
                    }
                    showToast(`↩️ 撤销: ${current.action}`, 1000);
                }
            }
            historyIndex--;
            updateUndoButton();
        }

        function updateUndoButton() {
            const btn = $('btnUndo');
            if (btn) {
                btn.style.opacity = historyIndex <= 0 ? '0.4' : '1';
                btn.title = historyIndex <= 0 ? '没有可撤销的操作' : `撤销 (${historyIndex} 步)`;
            }
        }

        // --- 保存功能 ---
        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('读取 Blob 为 DataURL 失败'));
                reader.readAsDataURL(blob);
            });
        }

        async function getImagePersistUrl(img) {
            const url = img.userData.url;
            if (!url) return '';
            if (typeof url === 'string' && url.startsWith('blob:')) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('从 blob URL 获取失败');
                    const blob = await response.blob();
                    return await blobToDataURL(blob);
                } catch (err) {
                    console.warn('Blob URL 转 data URL 失败，保留原 URL:', err);
                    return url;
                }
            }
            return url;
        }

        async function saveState() {
            try {
                const state = {
                    objects: customObjects.map(obj => ({
                        type: obj.userData.type || 'imported',
                        position: obj.position.toArray(),
                        rotation: obj.rotation.toArray(),
                        scale: obj.scale.toArray(),
                        color: obj.userData.color || 0x888888,
                        name: obj.userData.name || '物体'
                    })),
                    images: await Promise.all(images.map(async img => ({
                        position: img.position.toArray(),
                        quaternion: img.quaternion.toArray(),
                        size: img.userData.sz,
                        asp: img.userData.asp,
                        url: await getImagePersistUrl(img),
                        normal: img.userData.normal ? img.userData.normal.toArray() : null
                    }))),
                    lights: lightObjects.map(group => ({
                        position: group.position.toArray(),
                        quaternion: group.quaternion.toArray(),
                        size: group.userData.size,
                        intensity: group.userData.intensity,
                        normal: group.userData.normal ? group.userData.normal.toArray() : null
                    })),
                    waypoints: waypointMarkers.map(wp => ({
                        position: wp.position.toArray()
                    }))
                };

                const stateJson = JSON.stringify(state, null, 2);
                const blob = new Blob([stateJson], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `展馆布局_${new Date().toISOString().slice(0, 10)}.json`;
                a.style.display = 'none';
                a.target = '_blank';
                document.body.appendChild(a);

                let downloadSucceeded = true;
                try {
                    a.click();
                } catch (clickErr) {
                    downloadSucceeded = false;
                    console.warn('下载点击失败，尝试打开新窗口:', clickErr);
                    window.open(url, '_blank');
                }

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                if (downloadSucceeded) {
                    showToast('💾 已保存并下载文件', 1000);
                } else {
                    showToast('💾 已生成下载链接，请检查浏览器新窗口或下载工具', 2000);
                }
            } catch (err) {
                console.error('保存失败:', err);
                showToast('❌ 保存失败: ' + err.message, 3000);
            }
        }

        function clearCurrentLayout() {
            deselectObject();
            deselectLight();
            deselectImage();

            customObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            });
            customObjects.length = 0;
            objectIdCounter = 0;

            images.forEach(img => {
                scene.remove(img);
                if (img.material) img.material.dispose();
                if (img.geometry) img.geometry.dispose();
                if (img.userData.blob && img.userData.url) URL.revokeObjectURL(img.userData.url);
            });
            images.length = 0;
            imageIdCounter = 0;

            lightObjects.forEach(group => {
                scene.remove(group);
                group.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                    if (child.dispose) child.dispose();
                });
            });
            lightObjects.length = 0;
            lightIdCounter = 0;

            waypointMarkers.forEach(m => {
                scene.remove(m);
                m.children.forEach(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                });
            });
            waypointMarkers.length = 0;
            waypoints.length = 0;
            waypointId = 0;

            history.length = 0;
            historyIndex = -1;
            updateUndoButton();
        }

        function applyLayoutData(data) {
            if (!data) return;
            suppressHistory = true;
            clearCurrentLayout();

            if (data.objects) {
                data.objects.forEach(item => {
                    const pos = new THREE.Vector3(...item.position);
                    const normal = item.normal ? new THREE.Vector3(...item.normal) : new THREE.Vector3(0, 1, 0);
                    const obj = createGeometry(item.type || 'cube', pos, normal, item.color || 0x888888);
                    if (item.rotation) {
                        obj.rotation.fromArray(item.rotation);
                    }
                    if (item.scale) {
                        obj.scale.fromArray(item.scale);
                    }
                    if (item.name) {
                        obj.userData.name = item.name;
                    }
                });
            }

            if (data.images) {
                data.images.forEach(item => {
                    const pos = new THREE.Vector3(...item.position);
                    const normal = item.normal ? new THREE.Vector3(...item.normal) : new THREE.Vector3(0, 1, 0);
                    const url = item.url || 'https://picsum.photos/400/300?random=' + Date.now();
                    createImage(url, pos, normal, item.size || 1.0);
                });
            }

            if (data.lights) {
                data.lights.forEach(item => {
                    const pos = new THREE.Vector3(...item.position);
                    const normal = item.normal ? new THREE.Vector3(...item.normal) : new THREE.Vector3(0, 1, 0);
                    const light = createLightObject(pos, normal, item.size || 0.6, item.intensity || 2.0);
                    if (item.quaternion) {
                        light.quaternion.fromArray(item.quaternion);
                    }
                });
            }

            if (data.waypoints) {
                data.waypoints.forEach(item => {
                    const pos = new THREE.Vector3(...item.position);
                    createWaypointMarker(pos);
                });
            }
            suppressHistory = false;
        }

        function loadSavedLayout() {
            const raw = localStorage.getItem('exhibition_state');
            if (!raw) return;
            try {
                const data = JSON.parse(raw);
                if (!data || typeof data !== 'object') return;
                applyLayoutData(data);
                showToast('📥 已自动恢复上次保存布局', 1500);
            } catch (err) {
                console.warn('恢复保存布局失败:', err);
            }
        }

        // --- 绑定按钮 ---
        $('btnUndo').addEventListener('click', undo);
        $('btnSave').addEventListener('click', saveState);

        // ============================================================

        function importLayout(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    applyLayoutData(data);
                    showToast(
                        `✅ 导入成功！物体 ${data.objects?.length || 0} 个，图片 ${data.images?.length || 0} 张，灯光 ${data.lights?.length || 0} 个，动线点 ${data.waypoints?.length || 0} 个`,
                        3000);
                } catch (err) {
                    console.error('导入失败:', err);
                    showToast('❌ 导入失败: 文件格式无效', 2000);
                }
            };
            reader.readAsText(file);
        }

        $('btnExport').addEventListener('click', exportLayout);
        $('btnImport').addEventListener('click', () => { importInput.click(); });

        importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) { importLayout(file); }
            importInput.value = '';
        });

        loadSavedLayout();

        $('btnToggleLight').addEventListener('click', toggleLights);
        $('btnGlobalBright').addEventListener('click', toggleGlobalBright);

        const brightnessSlider = $('brightnessSlider');
        const brightnessValue = $('brightnessValue');

        brightnessSlider.value = '0.70';
        brightnessValue.textContent = '0.70';

        brightnessSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            brightnessValue.textContent = value.toFixed(2);
            updateBrightness(value);
        });

        // --- 清空所有 ---
        $('btnClearObjects').addEventListener('click', () => {
            const total = customObjects.length + lightObjects.length + images.length;
            if (!total || !confirm(`确定删除所有物体、图片和灯光（共 ${total} 个）吗？`)) return;
            deselectObject();
            deselectLight();
            deselectImage();
            customObjects.forEach(obj => {
                scene.remove(obj);
                obj.material.dispose();
                obj.geometry.dispose();
            });
            customObjects.length = 0;
            objectIdCounter = 0;
            images.forEach(img => {
                scene.remove(img);
                img.material.dispose();
                img.geometry.dispose();
                if (img.userData.blob) URL.revokeObjectURL(img.userData.url);
            });
            images.length = 0;
            imageIdCounter = 0;
            lightObjects.forEach(group => {
                scene.remove(group);
                group.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                    if (child.dispose) child.dispose();
                });
            });
            lightObjects.length = 0;
            lightIdCounter = 0;
            showToast('🗑️ 已清空所有物体、图片和灯光');
        });

        // --- 模式切换 ---
        function setBrowseMode() {
            isOverviewMode = false;
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.minPolarAngle = 0.1;
            controls.target.copy(START_TARGET);
            camera.position.set(START_POS.x, cameraHeight, START_POS.z);
            controls.update();
            modeText.textContent = '浏览';
            modeText.style.color = '#88ddff';
            $('btnOverview').textContent = '🔭 俯瞰';
            $('btnOverview').classList.remove('active');
        }

        function setOverviewMode() {
            isOverviewMode = true;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.maxPolarAngle = Math.PI;
            controls.minPolarAngle = 0;
            controls.target.copy(OVERVIEW_TARGET);
            camera.position.copy(OVERVIEW_POS);
            controls.update();
            modeText.textContent = '俯瞰';
            modeText.style.color = '#ffaa66';
            $('btnOverview').textContent = '🚶 回到地面';
            $('btnOverview').classList.add('active');
        }

        // ============================================================
        //  键盘控制
        // ============================================================
        const keys = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if ('wasd'.includes(key)) {
                keys[key] = true;
                e.preventDefault();
            }

            if (e.key === 'e' || e.key === 'E') {
                adjustCameraHeight(0.2);
                e.preventDefault();
            }
            if (e.key === 'q' || e.key === 'Q') {
                adjustCameraHeight(-0.2);
                e.preventDefault();
            }

            if (e.key === 'Escape') {
                if (isDraggingToPlace) {
                    cancelDragging();
                    e.preventDefault(); return;
                }
                deselectObject();
                deselectLight();
                deselectImage();
                hideScaleHandles();
                hideImageResizeHandles();
                coordToast.classList.remove('show');
                showToast('✅ 已退出');
                e.preventDefault();
            }
            if ((e.key === 'Delete' || e.key === 'Backspace')) {
                if (selectedObject) {
                    removeObject(selectedObject);
                    deselectObject();
                    hideScaleHandles();
                } else if (selectedImage) {
                    removeImage(selectedImage);
                    deselectImage();
                    hideImageResizeHandles();
                } else if (selectedLight) {
                    removeLight(selectedLight);
                    deselectLight();
                }
                e.preventDefault();
            }
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                undo();
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveState();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if ('wasd'.includes(key)) {
                keys[key] = false;
                e.preventDefault();
            }
        });

        function move(dt) {
            if (isImageEditing && selectedImage) {
                const speed = 2.5;
                const fwd = new THREE.Vector3();
                camera.getWorldDirection(fwd);
                fwd.y = 0;
                fwd.normalize();
                const d = new THREE.Vector3();
                if (keys.a) d.add(fwd.clone().multiplyScalar(speed * dt));
                if (keys.d) d.add(fwd.clone().multiplyScalar(-speed * dt));
                if (d.length()) {
                    selectedImage.position.add(d);
                    showImageResizeHandles(selectedImage);
                }
                return;
            }

            if (isMoving || isOverviewMode || isEditing || isLightEditing || isImageEditing || isScaling ||
                isImageResizing || isDraggingToPlace || isDragging) return;
            const speed = 3.5;
            const fwd = new THREE.Vector3();
            camera.getWorldDirection(fwd);
            fwd.y = 0;
            fwd.normalize();
            const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
            const d = new THREE.Vector3();
            if (keys.w) d.add(fwd.clone().multiplyScalar(speed * dt));
            if (keys.s) d.add(fwd.clone().multiplyScalar(-speed * dt));
            if (keys.a) d.add(right.clone().multiplyScalar(-speed * dt));
            if (keys.d) d.add(right.clone().multiplyScalar(speed * dt));
            if (d.length()) {
                camera.position.add(d);
                controls.target.add(d);
            }
        }

        // ============================================================
        //  动画循环
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            move(dt);
            updateMovement(dt);
            controls.update();
            composer.render();

            if (selectedObject && isEditing) {
                showScaleHandles(selectedObject);
            }
            if (selectedImage && isImageEditing) {
                showImageResizeHandles(selectedImage);
            }
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.domElement.setAttribute('tabindex', '0');
        renderer.domElement.focus();

        console.log('✅ 展馆已加载');
        console.log('🖼️ 右键墙面 → 上传图片 / 放置灯光');
        console.log('🧊 左侧工具栏：正方体 / 长方体');
        console.log('📐 双击编辑 | 拖拽手柄调大小');
        console.log('🎨 右键染色（黑/白/棕）| 右键删除');
        console.log('👁️ E/Q 调节视角高度');
        console.log('📍 动线点移动保持视角高度不变');
    </script>
</body>

</html>
